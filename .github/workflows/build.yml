name: Diptyx ESP32-S3 Build

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware_source/**"
      - ".github/workflows/diptyx-build-idf-5.5.2.yml"
  pull_request:
    paths:
      - "firmware_source/**"
      - ".github/workflows/diptyx-build-idf-5.5.2.yml"

permissions:
  contents: read

jobs:
  build:
    name: ESP32-S3 / ESP-IDF 5.5.2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.18"

      - name: Install project dependencies
        working-directory: firmware_source
        run: |
          pio pkg install

      - name: Exclude ESP-IDF 6+ LittleFS blockdev source
        working-directory: firmware_source
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          matches = list(Path(".pio/libdeps").glob("*/esp_littlefs/library.json"))

          if not matches:
              raise SystemExit("esp_littlefs/library.json not found")

          path = matches[0]
          data = json.loads(path.read_text())

          build = data.setdefault("build", {})
          src_filter = build.get("srcFilter", "+<*>")

          if "-<littlefs_bdl.c>" not in src_filter:
              src_filter += " -<littlefs_bdl.c>"

          build["srcFilter"] = src_filter
          path.write_text(json.dumps(data, indent=2) + "\n")

          print(f"Patched {path}")
          PY

      - name: Build LittleFS
        working-directory: firmware_source
        run: |
          pio run -t buildfs

      - name: Build firmware
        working-directory: firmware_source
        run: |
          pio run

      - name: Verify build
        working-directory: firmware_source
        run: |
          set -eux

          test -f .pio/build/esp32-s3-devkitm-1/firmware.bin
          test -f .pio/build/esp32-s3-devkitm-1/littlefs.bin
          test -f .pio/build/esp32-s3-devkitm-1/merged.bin
          test -f .pio/build/esp32-s3-devkitm-1/partitions.bin
          test -f .pio/build/esp32-s3-devkitm-1/bootloader.bin
          test -f .pio/build/esp32-s3-devkitm-1/firmware.elf

          echo "Build completed successfully."
          ls -lh .pio/build/esp32-s3-devkitm-1/*.bin
