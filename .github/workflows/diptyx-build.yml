name: Diptyx Diagnostic Build

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware_source/**"
      - ".github/workflows/diptyx-build.yml"
  pull_request:
    paths:
      - "firmware_source/**"
      - ".github/workflows/diptyx-build.yml"

permissions:
  contents: read

jobs:
  diagnostic-build:
    name: Diptyx Diagnostic Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.18"

      - name: Install project dependencies
        working-directory: firmware_source
        run: |
          pio pkg install --platform "espressif32"

      - name: Run diagnostic build
        working-directory: firmware_source
        continue-on-error: true
        run: |
          mkdir -p ci-report
          pio run 2>&1 | tee ci-report/build.log
          echo ${PIPESTATUS[0]} > ci-report/build-exit-code

      - name: Generate diagnostic report
        if: always()
        working-directory: firmware_source
        run: |
          mkdir -p ci-report

          REPORT="ci-report/diptyx-ci-report.txt"

          {
            echo "============================================================"
            echo "Diptyx CI Diagnostic Report"
            echo "============================================================"
            echo

            echo "This report is intended to help diagnose build failures"
            echo "without modifying the Diptyx source or dependencies."
            echo

            echo "============================================================"
            echo "1. BUILD RESULT"
            echo "============================================================"
            echo

            if [ -f ci-report/build-exit-code ]; then
              EXIT_CODE=$(cat ci-report/build-exit-code)

              if [ "$EXIT_CODE" = "0" ]; then
                echo "Build result: SUCCESS"
              else
                echo "Build result: FAILURE"
                echo "Build exit code: $EXIT_CODE"
              fi
            else
              echo "Build result: UNKNOWN"
            fi

            echo

            echo "============================================================"
            echo "2. GITHUB ENVIRONMENT"
            echo "============================================================"
            echo

            echo "Repository:"
            echo "${GITHUB_REPOSITORY}"

            echo
            echo "Workflow:"
            echo "${GITHUB_WORKFLOW}"

            echo
            echo "Run number:"
            echo "${GITHUB_RUN_NUMBER}"

            echo
            echo "Run ID:"
            echo "${GITHUB_RUN_ID}"

            echo
            echo "Event:"
            echo "${GITHUB_EVENT_NAME}"

            echo
            echo "Branch:"
            echo "${GITHUB_REF_NAME}"

            echo
            echo "Commit:"
            echo "${GITHUB_SHA}"

            echo
            echo "Runner:"
            echo "${RUNNER_NAME}"

            echo
            echo "Operating system:"
            echo "${RUNNER_OS}"

            echo
            echo "Runner architecture:"
            echo "${RUNNER_ARCH}"

            echo

            echo "============================================================"
            echo "3. OPERATING SYSTEM"
            echo "============================================================"
            echo

            cat /etc/os-release

            echo
            echo "Kernel:"
            uname -a

            echo
            echo "CPU:"
            lscpu

            echo
            echo "Memory:"
            free -h

            echo
            echo "Disk:"
            df -h

            echo

            echo "============================================================"
            echo "4. GIT"
            echo "============================================================"
            echo

            git --version

            echo
            echo "Repository root:"
            git rev-parse --show-toplevel

            echo
            echo "Commit:"
            git rev-parse HEAD

            echo
            echo "Branch:"
            git branch --show-current

            echo
            echo "Status:"
            git status --short

            echo

            echo "============================================================"
            echo "5. PYTHON"
            echo "============================================================"
            echo

            python --version
            python -m pip --version

            echo
            echo "Installed Python packages:"
            python -m pip list

            echo

            echo "============================================================"
            echo "6. PLATFORMIO"
            echo "============================================================"
            echo

            pio --version

            echo
            echo "PlatformIO system information:"
            pio system info

            echo

            echo "============================================================"
            echo "7. PROJECT CONFIGURATION"
            echo "============================================================"
            echo

            echo "--- platformio.ini ---"
            cat platformio.ini

            echo

            echo "--- partitions.csv ---"
            if [ -f partitions.csv ]; then
              cat partitions.csv
            else
              echo "File not found"
            fi

            echo

            echo "--- CMakeLists.txt ---"
            if [ -f CMakeLists.txt ]; then
              cat CMakeLists.txt
            else
              echo "File not found"
            fi

            echo

            echo "============================================================"
            echo "8. LOCKED DEPENDENCIES"
            echo "============================================================"
            echo

            if [ -f dependencies.lock ]; then
              cat dependencies.lock
            else
              echo "dependencies.lock not found"
            fi

            echo

            echo "============================================================"
            echo "9. COMPONENT MANIFESTS"
            echo "============================================================"
            echo

            echo "--- Component manifests ---"

            find components managed_components \
              -type f \
              \( -name "idf_component.yml" -o -name "component.yml" \) \
              -print 2>/dev/null \
              | sort \
              | while read -r FILE; do
                  echo
                  echo "------------------------------------------------------------"
                  echo "$FILE"
                  echo "------------------------------------------------------------"
                  cat "$FILE"
                done

            echo

            echo "============================================================"
            echo "10. PLATFORMIO PACKAGE RESOLUTION"
            echo "============================================================"
            echo

            echo "--- pio pkg list ---"
            pio pkg list

            echo

            echo "--- Installed PlatformIO platforms ---"
            find "$HOME/.platformio/platforms" \
              -maxdepth 2 \
              -type f \
              -name "platform.json" \
              -print 2>/dev/null \
              | sort \
              | while read -r FILE; do
                  echo
                  echo "------------------------------------------------------------"
                  echo "$FILE"
                  echo "------------------------------------------------------------"
                  cat "$FILE"
                done

            echo

            echo "--- Installed PlatformIO packages ---"
            find "$HOME/.platformio/packages" \
              -maxdepth 2 \
              -type f \
              -name "package.json" \
              -print 2>/dev/null \
              | sort \
              | while read -r FILE; do
                  echo
                  echo "------------------------------------------------------------"
                  echo "$FILE"
                  echo "------------------------------------------------------------"
                  cat "$FILE"
                done

            echo

            echo "============================================================"
            echo "11. ESP-IDF INFORMATION"
            echo "============================================================"
            echo

            if [ -d "$HOME/.platformio/packages/framework-espidf" ]; then
              IDF="$HOME/.platformio/packages/framework-espidf"

              echo "ESP-IDF directory:"
              echo "$IDF"

              echo
              echo "ESP-IDF version files:"

              find "$IDF" -maxdepth 2 \
                -type f \
                \( -name "version.txt" -o -name "idf_version.h" \) \
                -print 2>/dev/null \
                | sort \
                | while read -r FILE; do
                    echo
                    echo "--- $FILE ---"
                    cat "$FILE"
                  done

              echo
              echo "ESP-IDF git information:"

              if [ -d "$IDF/.git" ]; then
                git -C "$IDF" describe --always --dirty 2>&1 || true
                git -C "$IDF" rev-parse HEAD 2>&1 || true
              else
                echo "ESP-IDF package does not contain a .git directory."
              fi
            else
              echo "framework-espidf package was not found."
            fi

            echo

            echo "============================================================"
            echo "12. ENVIRONMENT VARIABLES"
            echo "============================================================"
            echo

            env | sort | grep -Ei \
              '^(IDF|ESP|PLATFORMIO|PIO|PATH|PYTHON|CI|GITHUB|RUNNER)_' \
              || true

            echo

            echo "============================================================"
            echo "13. BUILD LOG"
            echo "============================================================"
            echo

            if [ -f ci-report/build.log ]; then
              cat ci-report/build.log
            else
              echo "Build log not found."
            fi

            echo

            echo "============================================================"
            echo "14. BUILD OUTPUT"
            echo "============================================================"
            echo

            if [ -d .pio ]; then
              echo "--- .pio directory ---"
              du -ah .pio | sort -h | tail -100

              echo
              echo "--- Firmware files ---"

              find .pio -type f \
                \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) \
                -print 2>/dev/null \
                | sort
            else
              echo ".pio directory was not created."
            fi

            echo

            echo "============================================================"
            echo "15. SOURCE TREE"
            echo "============================================================"
            echo

            find . \
              -path "./.pio" -prune -o \
              -path "./ci-report" -prune -o \
              -type f -print \
              | sort

            echo

            echo "============================================================"
            echo "END OF REPORT"
            echo "============================================================"

          } > "$REPORT"

          echo
          echo "============================================================"
          echo "DIAGNOSTIC REPORT CREATED"
          echo "============================================================"
          echo
          echo "Report: $REPORT"
          echo
          wc -l "$REPORT"
          du -h "$REPORT"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diptyx-ci-report
          path: firmware_source/ci-report/diptyx-ci-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Display diagnostic summary
        if: always()
        working-directory: firmware_source
        run: |
          echo
          echo "============================================================"
          echo "DIPTYX CI DIAGNOSTIC SUMMARY"
          echo "============================================================"

          if [ -f ci-report/build-exit-code ]; then
            EXIT_CODE=$(cat ci-report/build-exit-code)
            echo "Build exit code: $EXIT_CODE"

            if [ "$EXIT_CODE" != "0" ]; then
              echo "Build failed."
              echo
              echo "The complete diagnostic report is available as:"
              echo "diptyx-ci-report"
            else
              echo "Build succeeded."
            fi
          else
            echo "Build did not produce an exit code."
          fi
