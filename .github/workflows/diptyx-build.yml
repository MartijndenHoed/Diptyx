name: Diptyx Firmware Build

on:
workflow_dispatch:
push:
paths:
- "firmware_source/**"
- ".github/workflows/diptyx-build.yml"
pull_request:
paths:
- "firmware_source/**"
- ".github/workflows/diptyx-build.yml"

permissions:
contents: read

jobs:
build:
name: Build Diptyx firmware
runs-on: ubuntu-24.04

```
defaults:
  run:
    working-directory: firmware_source

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Show runner information
    working-directory: .
    run: |
      echo "=== Git ==="
      git --version
      git rev-parse HEAD
      git status --short

      echo
      echo "=== OS ==="
      cat /etc/os-release

      echo
      echo "=== Python ==="
      python3 --version

      echo
      echo "=== Disk ==="
      df -h

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
      cache: "pip"
      cache-dependency-path: firmware_source/platformio.ini

  - name: Install PlatformIO
    run: |
      python -m pip install --upgrade pip
      python -m pip install "platformio==6.1.18"

  - name: Show PlatformIO version
    run: |
      pio --version
      pio system info

  - name: Show project files
    run: |
      echo "=== Project files ==="
      find . -maxdepth 2 -type f \
        ! -path "./.pio/*" \
        ! -path "./.git/*" \
        | sort

      echo
      echo "=== platformio.ini ==="
      cat platformio.ini

      echo
      echo "=== dependencies.lock ==="
      if [ -f dependencies.lock ]; then
        cat dependencies.lock
      else
        echo "No dependencies.lock found"
      fi

      echo
      echo "=== partitions.csv ==="
      cat partitions.csv

  - name: Install Espressif32 platform
    run: |
      pio pkg install \
        --platform "espressif32"

  - name: Show installed packages
    run: |
      echo "=== PlatformIO packages ==="
      pio pkg list

      echo
      echo "=== PlatformIO platforms ==="
      pio pkg list --global --only-platform

      echo
      echo "=== PlatformIO system info ==="
      pio system info

  - name: Show ESP-IDF and component information
    run: |
      echo "=== ESP-IDF-related environment ==="
      env | sort | grep -Ei 'idf|esp|platformio|python' || true

      echo
      echo "=== Managed components ==="
      if [ -d managed_components ]; then
        find managed_components -maxdepth 2 -type f \
          \( -name "idf_component.yml" -o -name "component.yml" \) \
          -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
      else
        echo "No managed_components directory"
      fi

      echo
      echo "=== dependencies.lock ==="
      if [ -f dependencies.lock ]; then
        cat dependencies.lock
      fi

  - name: Build firmware
    run: |
      set -o pipefail
      mkdir -p ci-logs

      pio run 2>&1 | tee ci-logs/pio-build.log

  - name: Inspect build output
    if: always()
    run: |
      echo "=== .pio directory ==="
      if [ -d .pio ]; then
        du -ah .pio | sort -h | tail -100
      else
        echo "No .pio directory was created"
      fi

      echo
      echo "=== Firmware binaries ==="
      find .pio -type f \
        \( -name "*.bin" -o -name "*.elf" -o -name "*.map" \) \
        -print 2>/dev/null | sort || true

  - name: Generate build information
    if: always()
    run: |
      mkdir -p ci-logs

      {
        echo "Diptyx CI Build Information"
        echo "==========================="
        echo
        echo "Git commit:"
        git rev-parse HEAD
        echo
        echo "Git branch:"
        git branch --show-current
        echo
        echo "PlatformIO:"
        pio --version
        echo
        echo "PlatformIO system info:"
        pio system info
        echo
        echo "Installed packages:"
        pio pkg list
        echo
        echo "Dependencies lock:"
        cat dependencies.lock 2>/dev/null || true
      } > ci-logs/build-info.txt

  - name: Generate checksums
    if: always()
    run: |
      mkdir -p ci-logs

      find .pio -type f \
        \( -name "*.bin" -o -name "*.elf" \) \
        -print0 2>/dev/null \
        | sort -z \
        | xargs -0 -r sha256sum \
        > ci-logs/SHA256SUMS

      echo "=== SHA256SUMS ==="
      cat ci-logs/SHA256SUMS || true

  - name: Upload build diagnostics
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: diptyx-build-diagnostics-${{ github.sha }}
      path: |
        firmware_source/ci-logs/
        firmware_source/.pio/**/*.bin
        firmware_source/.pio/**/*.elf
        firmware_source/.pio/**/*.map
      if-no-files-found: warn
      retention-days: 14
```
