 ; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
lib_deps = https://github.com/joltwallet/esp_littlefs.git

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_files = 
    src/fonts/unifont.hex
    src/fonts/charWidths.hex
    src/fonts/pageShowcase.html
extra_scripts = merge_bin.py
board_build.psram = true
board_build.enable_psram = true
board_build.filesystem = littlefs
lib_deps = ${common.lib_deps}
build_unflags = 
    -Os
    -Og
build_flags = 
    -O3
    -Wno-maybe-uninitialized
    -DBOARD_HAS_PSRAM
    -Wno-error=overloaded-virtual
    -DCONFIG_FATFS_USE_LFN=1
    -DCONFIG_FATFS_LFN_HEAP=1
    -DFF_USE_LFN=3
    -DFF_MAX_LFN=255
    -DCONFIG_TINYUSB_ENABLED=1
    -DCONFIG_USB_DEVICE_ENABLED=1
    -DCONFIG_USB_DEVICE_VFS_SUPPORT=1
    -DCONFIG_TINYUSB_DESC_USE_STRING=1
    -D CONFIG_LITTLEFS_FOR_IDF_5_0